name: Deploy to the server

# Continuous deployment to https://thebelt.patchnotes.ca, the owner's VPS (docs/deploying.md).
#
# Every push to main (and a manual run) builds the game on the owner's PC, the belt-pc runner, like CI and Pages:
# GitHub-hosted runners are not available to this private repository (no paid minutes). The build, with the
# Dockerfile and the container's Caddyfile, is bundled and streamed over SSH to the server's `deploy` user, whose key
# for this project is forced to one command (`the-belt <commit sha>`). That runs deploy-the-belt (deploy/server/):
# build the image there, replace the running container, wait for its healthcheck, roll back on failure. This job
# then waits until /version.txt on the live site (through Cloudflare) reports the commit. No registry is involved.
#
# The merge itself was already gated by CI (main's ruleset), so this does not re-run the suites. With one runner,
# it queues behind CI's quick already-tested check and the Pages publish.
# Secrets (environment "production"): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a newer main never cancels one that is going out.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SITE: https://thebelt.patchnotes.ca

jobs:
  deploy:
    name: Build and deploy to production
    runs-on: [self-hosted, belt-pc]
    timeout-minutes: 30
    environment:
      name: production
      url: https://thebelt.patchnotes.ca
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # For the root of the domain (the default base), unlike the Pages build.
      - run: npm run build
      - name: Bundle the site with its container recipe
        shell: powershell
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'the-belt-site'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force (Join-Path $stage 'deploy') | Out-Null
          Copy-Item Dockerfile $stage
          Copy-Item deploy\container.Caddyfile (Join-Path $stage 'deploy')
          Copy-Item -Recurse dist (Join-Path $stage 'dist')
          tar -czf "$env:RUNNER_TEMP\the-belt-site.tar.gz" -C $stage .
          Get-Item "$env:RUNNER_TEMP\the-belt-site.tar.gz" | Select-Object Name, Length | Format-List
      - name: Install the deploy key
        shell: powershell
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'deploy-ssh'
          New-Item -ItemType Directory -Force $dir | Out-Null
          [IO.File]::WriteAllText("$dir\key", $env:KEY.Replace("`r`n", "`n").TrimEnd() + "`n")
          [IO.File]::WriteAllText("$dir\known_hosts", $env:KNOWN.TrimEnd() + "`n")
          # Windows OpenSSH refuses a private key other accounts can read
          icacls "$dir\key" /inheritance:r /grant:r "$($env:USERNAME):R" | Out-Null
      - name: Deploy (the server builds the image, waits for healthy, rolls back on failure)
        shell: powershell
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'deploy-ssh'
          $ssh = Join-Path $env:SystemRoot 'System32\OpenSSH\ssh.exe'
          $sshArgs = @('-i', "`"$dir\key`"", '-o', "`"UserKnownHostsFile=$dir\known_hosts`"", '-o', 'StrictHostKeyChecking=yes',
            '-o', 'BatchMode=yes', '-o', 'ConnectTimeout=20', "$env:USER@$env:HOST", '"the-belt ${{ github.sha }}"')
          $p = Start-Process -FilePath $ssh -ArgumentList $sshArgs -RedirectStandardInput "$env:RUNNER_TEMP\the-belt-site.tar.gz" -NoNewWindow -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Output "deploy failed with exit code $($p.ExitCode)"; exit $p.ExitCode }
      - name: Verify the live site serves this commit
        shell: powershell
        run: |
          $sha = '${{ github.sha }}'
          $live = ''
          foreach ($i in 1..24) {
            try { $live = (Invoke-WebRequest -UseBasicParsing "$env:SITE/version.txt?nocache=$(Get-Random)" -TimeoutSec 15).Content.Trim() } catch { $live = '' }
            if ($live -eq $sha) { break }
            Start-Sleep -Seconds 5
          }
          if ($live) { Write-Output "live version: $live" } else { Write-Output "live version: unreachable" }
          if ($live -ne $sha) { exit 1 }
          $page = Invoke-WebRequest -UseBasicParsing "$env:SITE/" -TimeoutSec 30
          Write-Output "home page: HTTP $($page.StatusCode)"
          $depot = Invoke-WebRequest -UseBasicParsing "$env:SITE/?mode=3d" -TimeoutSec 30
          Write-Output "3D depot: HTTP $($depot.StatusCode)"
      - name: Remove the deploy key and the bundle
        if: always()
        shell: powershell
        run: |
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'deploy-ssh') -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force (Join-Path $env:RUNNER_TEMP 'the-belt-site') -ErrorAction SilentlyContinue
          Remove-Item -Force "$env:RUNNER_TEMP\the-belt-site.tar.gz" -ErrorAction SilentlyContinue
          exit 0
