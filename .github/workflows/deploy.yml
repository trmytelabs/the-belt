name: Deploy to the server

# Continuous deployment to https://thebelt.fun, the owner's VPS (docs/deploying.md).
#
# Every pull request and every push to main builds the game on a GitHub-hosted runner, bundles it with the
# Dockerfile and the container's Caddyfile, builds that image and smoke-tests it locked down as in production.
# Pushes to main then push the image to ghcr.io/trmytelabs/the-belt:<commit sha> and ask the server over SSH to
# deploy it: the `deploy` user's key is forced to a gate that accepts only `the-belt <commit sha>` and runs the
# server's deploy-app, which pulls that image, swaps the container, waits for its healthcheck and rolls back on
# failure. The pipeline then waits until /version.txt on the live site (through Cloudflare) reports this commit.
# Pull requests never push or deploy.
#
# The merge itself was already gated by CI (main's ruleset), so this does not re-run the suites. This repository
# allows GitHub-owned actions only, so the image is built with plain docker commands.
# Secrets (environment "production"): DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  # superseded pull request runs can stop; runs on main always finish so a deploy is never cut off halfway
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE: https://thebelt.fun
  IMAGE: ghcr.io/trmytelabs/the-belt

jobs:
  image:
    name: Site bundle and container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # push to ghcr.io on main only (the push step skips pull requests)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # For the root of the domain (the default base), unlike the Pages build.
      - run: npm run build
      - name: Bundle the site with its container recipe
        run: |
          mkdir -p bundle/deploy
          cp Dockerfile bundle/ && cp deploy/container.Caddyfile bundle/deploy/ && cp -r dist bundle/dist
          tar -czf the-belt-site.tar.gz -C bundle .
          ls -l the-belt-site.tar.gz
      - name: Build the image from the bundle and smoke test it (read-only, no capabilities, like production)
        run: |
          # the source label links the GHCR package to this (public) repository
          docker build --build-arg "GIT_SHA=${{ github.sha }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" -t the-belt:smoke bundle
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -p 8080:8080 the-belt:smoke
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && break; sleep 1; done
          test "$(curl -sf http://localhost:8080/version.txt)" = "${{ github.sha }}"
          curl -sf -o /dev/null http://localhost:8080/
          curl -sf -o /dev/null "http://localhost:8080/?mode=3d"
          curl -sfI http://localhost:8080/ | grep -i '^content-security-policy'
          # the 3D depot's files came along: a character, a texture and a track
          curl -sfI http://localhost:8080/models/characters/aj.glb | head -1
          curl -sfI http://localhost:8080/textures/asphalt_color.webp | head -1
          curl -sfI http://localhost:8080/audio/music/after-hours.mp3 | head -1
          docker rm -f smoke
      - name: Push the image to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag the-belt:smoke "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"
          docker logout ghcr.io

  deploy:
    name: Deploy to production
    needs: image
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://thebelt.fun
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Install the deploy key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts_deploy
      - name: Deploy (the server pulls the image, waits for healthy, rolls back on failure)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy -o UserKnownHostsFile=~/.ssh/known_hosts_deploy -o StrictHostKeyChecking=yes \
            -o BatchMode=yes -o ConnectTimeout=20 -n "$USER@$HOST" "the-belt ${{ github.sha }}"
      - name: Verify the live site serves this commit
        run: |
          for i in $(seq 1 24); do
            live=$(curl -sf "$SITE/version.txt?nocache=$RANDOM$RANDOM" || true)
            [ "$live" = "${{ github.sha }}" ] && break
            sleep 5
          done
          echo "live version: ${live:-unreachable}"
          test "$live" = "${{ github.sha }}"
          curl -sSf -o /dev/null -w "home page: HTTP %{http_code} in %{time_total}s\n" "$SITE/"
          curl -sSf -o /dev/null -w "3D depot: HTTP %{http_code}\n" "$SITE/?mode=3d"
      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy
