name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    # The 3D suite plays the larger city, both loading yards and touch detours; on the
    # software renderer it takes 21 to 29 minutes depending on the runner it lands on,
    # and a slow runner has pushed it well past that.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:model
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          BELT_BROWSER_RENDERER: canvas
  windows-browser:
    name: Windows browser gameplay checks
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      # The 3D preview's check runs in the Linux job. This GPU-free Windows
      # runner's software WebGL delays input by seconds, unlike real PCs.
      - run: npm run test:browser:classic
        env:
          BELT_BROWSER_EXECUTABLE: C:/Program Files (x86)/Microsoft/Edge/Application/msedge.exe
          BELT_BROWSER_RENDERER: canvas
