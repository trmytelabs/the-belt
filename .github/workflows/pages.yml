name: Pages

# Publishes the game from main to GitHub Pages at https://thebelt.fun/, the repository's custom domain
# (the owner's choice, 2026-10-26; Pages itself since 2026-10-23). See docs/deploying.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and a newer main never cancels one that is going out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      # The custom domain serves the site from its root, so the default base (/) is right (src/three/assetBase.ts).
      - run: npm run build
      # The artifact deploy-pages expects: the site as one tar named github-pages.
      - name: Archive the site
        run: tar -cf "$RUNNER_TEMP/artifact.tar" -C dist .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
