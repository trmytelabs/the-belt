<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>THE BELT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background: #000000;
        overscroll-behavior: none;
        touch-action: none;
      }

      body {
        overflow: hidden;
        font-family: Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      #app {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        inset: 0;
        background: #000000;
        --game-width-fit: min(100vw, calc(100dvh * 1.333333));
        --side-gutter: max(0px, calc((100vw - var(--game-width-fit)) / 2));
      }

      canvas {
        display: block;
        touch-action: none;
        image-rendering: auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .mobile-control-layer {
        display: none;
      }

      @media (pointer: coarse) {
        .mobile-control-layer {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: block;
          pointer-events: none;
          touch-action: none;
        }

        .mobile-stick,
        .mobile-action-rail {
          pointer-events: auto;
          position: fixed;
          touch-action: none;
          -webkit-tap-highlight-color: transparent;
        }

        .mobile-stick {
          left: max(14px, calc((var(--side-gutter) * 0.5) - 54px));
          bottom: max(18px, env(safe-area-inset-bottom));
          width: 108px;
          height: 108px;
          border: 2px solid rgba(255, 255, 255, 0.36);
          border-radius: 999px;
          background: rgba(0, 0, 0, 0.42);
          box-shadow:
            inset 0 0 24px rgba(255, 248, 196, 0.08),
            0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .mobile-stick-knob {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 44px;
          height: 44px;
          border: 2px solid rgba(255, 255, 255, 0.44);
          border-radius: 999px;
          background: rgba(255, 248, 196, 0.5);
          transform: translate(-50%, -50%);
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.42);
        }

        .mobile-action-rail {
          right: max(14px, calc((var(--side-gutter) * 0.5) - 88px));
          bottom: max(28px, calc(env(safe-area-inset-bottom) + 8px));
          display: flex;
          gap: 12px;
          align-items: center;
        }

        .mobile-action-button {
          width: 82px;
          height: 82px;
          border: 2px solid rgba(255, 255, 255, 0.34);
          border-radius: 999px;
          color: #ffffff;
          background: rgba(0, 0, 0, 0.48);
          font: 800 13px "Space Grotesk", Arial, sans-serif;
          letter-spacing: 0.5px;
          text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
          box-shadow:
            inset 0 0 22px rgba(255, 248, 196, 0.07),
            0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .mobile-action-button.is-pressed {
          transform: scale(0.92);
          background: rgba(255, 248, 196, 0.24);
        }
      }

      @media (pointer: coarse) and (orientation: landscape) {
        #app {
          justify-content: center;
          align-items: center;
        }

        .mobile-stick {
          left: max(14px, calc((var(--side-gutter) * 0.5) - 54px));
          bottom: max(28px, calc(env(safe-area-inset-bottom) + 8px));
        }

        .mobile-action-rail {
          right: max(14px, calc((var(--side-gutter) * 0.5) - 88px));
          bottom: max(28px, calc(env(safe-area-inset-bottom) + 8px));
          flex-direction: column;
          gap: 10px;
        }

        .mobile-action-button {
          width: 78px;
          height: 78px;
          font-size: 12px;
        }
      }

      @media (pointer: coarse) and (orientation: portrait) {
        #app {
          align-items: flex-end;
          padding-bottom: max(0px, env(safe-area-inset-bottom));
        }

        .mobile-stick {
          left: 16px;
          bottom: max(96px, calc(env(safe-area-inset-bottom) + 96px));
          width: 96px;
          height: 96px;
        }

        .mobile-stick-knob {
          width: 40px;
          height: 40px;
        }

        .mobile-action-rail {
          right: 16px;
          left: auto;
          bottom: max(96px, calc(env(safe-area-inset-bottom) + 96px));
          flex-direction: column;
          gap: 10px;
        }

        .mobile-action-button {
          width: 76px;
          height: 76px;
          font-size: 12px;
        }

        .mobile-control-layer::before {
          content: "Rotate your phone for the full-size layout";
          position: fixed;
          left: 50%;
          top: 14px;
          transform: translateX(-50%);
          padding: 8px 12px;
          border: 1px solid rgba(255, 248, 196, 0.28);
          border-radius: 8px;
          color: #fff8c4;
          background: rgba(0, 0, 0, 0.58);
          font: 700 12px "Space Grotesk", Arial, sans-serif;
          white-space: nowrap;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
