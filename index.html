<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>THE BELT</title>
    <meta name="description" content="THE BELT: one night on the sort at a UPS depot, from Termite and Skanky's nights on the belt." />
    <meta name="theme-color" content="#0b171c" />
    <meta property="og:title" content="THE BELT" />
    <meta property="og:description" content="One night on the sort at a UPS depot: the belt, the trucks, the crew, a Timmies run and dim sum after." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b171c'/%3E%3Crect x='6' y='40' width='52' height='10' rx='3' fill='%233b2a1e'/%3E%3Crect x='16' y='18' width='30' height='22' rx='2' fill='%23c99a5b'/%3E%3Crect x='16' y='26' width='30' height='4' fill='%23a87a40'/%3E%3Ccircle cx='14' cy='45' r='3' fill='%23edba6d'/%3E%3Ccircle cx='32' cy='45' r='3' fill='%23edba6d'/%3E%3Ccircle cx='50' cy='45' r='3' fill='%23edba6d'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        background: #000000;
        overscroll-behavior: none;
        touch-action: none;
      }

      body {
        overflow: hidden;
        font-family: Arial, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }

      #app {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: fixed;
        inset: 0;
        background: #000000;
        --game-width-fit: min(100vw, calc(100dvh * 1.333333));
        --side-gutter: max(0px, calc((100vw - var(--game-width-fit)) / 2));
      }

      canvas {
        display: block;
        touch-action: none;
        image-rendering: auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .mobile-control-layer {
        display: none;
      }

      @media (pointer: coarse) {
        .mobile-control-layer {
          position: fixed;
          inset: 0;
          z-index: 10;
          display: block;
          pointer-events: none;
          touch-action: none;
        }

        .mobile-stick,
        .mobile-action-rail {
          pointer-events: auto;
          position: fixed;
          touch-action: none;
          -webkit-tap-highlight-color: transparent;
        }

        .mobile-stick {
          left: max(14px, calc((var(--side-gutter) * 0.5) - 54px));
          bottom: max(18px, env(safe-area-inset-bottom));
          width: 108px;
          height: 108px;
          border: 2px solid rgba(255, 255, 255, 0.36);
          border-radius: 999px;
          background: rgba(0, 0, 0, 0.42);
          box-shadow:
            inset 0 0 24px rgba(255, 248, 196, 0.08),
            0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .mobile-stick-knob {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 44px;
          height: 44px;
          border: 2px solid rgba(255, 255, 255, 0.44);
          border-radius: 999px;
          background: rgba(255, 248, 196, 0.5);
          transform: translate(-50%, -50%);
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.42);
        }

        .mobile-action-rail {
          right: max(14px, calc((var(--side-gutter) * 0.5) - 88px));
          bottom: max(28px, calc(env(safe-area-inset-bottom) + 8px));
          display: flex;
          gap: 12px;
          align-items: center;
        }

        .mobile-action-button {
          width: 82px;
          height: 82px;
          border: 2px solid rgba(255, 255, 255, 0.34);
          border-radius: 999px;
          color: #ffffff;
          background: rgba(0, 0, 0, 0.48);
          font: 800 13px "Space Grotesk", Arial, sans-serif;
          letter-spacing: 0.5px;
          text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
          box-shadow:
            inset 0 0 22px rgba(255, 248, 196, 0.07),
            0 10px 30px rgba(0, 0, 0, 0.35);
        }

        .mobile-action-button.is-pressed {
          transform: scale(0.92);
          background: rgba(255, 248, 196, 0.24);
        }
      }

      @media (pointer: coarse) and (orientation: landscape) {
        #app {
          justify-content: center;
          align-items: center;
        }

        .mobile-stick {
          left: max(14px, calc((var(--side-gutter) * 0.5) - 54px));
          bottom: max(28px, calc(env(safe-area-inset-bottom) + 8px));
        }

        .mobile-action-rail {
          right: max(14px, calc((var(--side-gutter) * 0.5) - 88px));
          bottom: max(28px, calc(env(safe-area-inset-bottom) + 8px));
          flex-direction: column;
          gap: 10px;
        }

        .mobile-action-button {
          width: 78px;
          height: 78px;
          font-size: 12px;
        }
      }

      @media (pointer: coarse) and (orientation: portrait) {
        #app {
          align-items: flex-end;
          padding-bottom: max(0px, env(safe-area-inset-bottom));
        }

        .mobile-stick {
          left: 16px;
          bottom: max(96px, calc(env(safe-area-inset-bottom) + 96px));
          width: 96px;
          height: 96px;
        }

        .mobile-stick-knob {
          width: 40px;
          height: 40px;
        }

        .mobile-action-rail {
          right: 16px;
          left: auto;
          bottom: max(96px, calc(env(safe-area-inset-bottom) + 96px));
          flex-direction: column;
          gap: 10px;
        }

        .mobile-action-button {
          width: 76px;
          height: 76px;
          font-size: 12px;
        }

        .mobile-control-layer::before {
          content: "Rotate your phone for the full-size layout";
          position: fixed;
          left: 50%;
          top: 14px;
          transform: translateX(-50%);
          padding: 8px 12px;
          border: 1px solid rgba(255, 248, 196, 0.28);
          border-radius: 8px;
          color: #fff8c4;
          background: rgba(0, 0, 0, 0.58);
          font: 700 12px "Space Grotesk", Arial, sans-serif;
          white-space: nowrap;
        }
      }
      /* The loading screen: the title over a moving belt until the depot is ready (src/main.ts removes it). */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-content: center;
        gap: 14px;
        text-align: center;
        background: radial-gradient(ellipse at 50% 40%, #16303a 0%, #0b171c 60%, #060b0d 100%);
        color: #f0e7cf;
        pointer-events: none;
        transition: opacity 0.5s ease;
      }
      #boot.gone { opacity: 0; }
      #boot h1 { margin: 0; font: 400 clamp(56px, 12vw, 120px)/0.9 "Bebas Neue", Impact, sans-serif; letter-spacing: 4px; }
      #boot p { margin: 0; font: 500 14px "Space Grotesk", Arial, sans-serif; letter-spacing: 3px; color: #edb765; }
      #boot .belt {
        width: min(420px, 70vw);
        height: 14px;
        margin: 6px auto 0;
        border-radius: 4px;
        background: repeating-linear-gradient(90deg, #2b2f31 0 18px, #3b4144 18px 22px);
        background-size: 44px 14px;
        box-shadow: 0 0 0 2px #edb76555;
        animation: boot-belt 0.9s linear infinite;
      }
      #boot .parcel { width: 26px; height: 18px; margin: 0 auto -6px; border-radius: 3px; background: #c99a5b; box-shadow: inset 0 -5px #a87a40; animation: boot-parcel 2.4s ease-in-out infinite; }
      @keyframes boot-belt { to { background-position: 44px 0; } }
      @keyframes boot-parcel { 0% { transform: translateX(-160px); opacity: 0; } 15%, 85% { opacity: 1; } 100% { transform: translateX(160px); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #boot .belt, #boot .parcel { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" aria-live="polite">
      <h1>THE BELT</h1>
      <div class="parcel"></div>
      <div class="belt"></div>
      <p>LOADING THE DEPOT…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
